<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://www.squishysmash.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF8FB8" />
    <meta
      name="description"
      content="Squishy Smash — the cozy kawaii collectible tap game. 48 cards across three pastel packs. Three ways to unlock every card: play, save coins, or earn through achievements."
    />

    <!-- Open Graph (Facebook / LinkedIn / iMessage / Slack previews) -->
    <meta property="og:site_name" content="Squishy Smash" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.squishysmash.com" />
    <meta
      property="og:title"
      content="Squishy Smash — Tap. Squish. Pop. Collect."
    />
    <meta
      property="og:description"
      content="48 collectible cards. Three ways to unlock every one. A cozy kawaii tap game made for short, satisfying sessions."
    />
    <meta
      property="og:image"
      content="https://www.squishysmash.com/social-card.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="The Celestial Dumpling Core — the launch pack's Legendary card — centered on Squishy Smash's deep-purple brand backdrop."
    />

    <!-- Twitter Card — points iMessage/X share previews at the same hero card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@squishy_smash" />
    <meta name="twitter:creator" content="@squishy_smash" />
    <meta
      name="twitter:title"
      content="Squishy Smash — Tap. Squish. Pop. Collect."
    />
    <meta
      name="twitter:description"
      content="48 collectible cards. Three ways to unlock every one. A cozy kawaii tap game."
    />
    <meta
      name="twitter:image"
      content="https://www.squishysmash.com/social-card.jpg"
    />

    <title>Squishy Smash — Tap. Squish. Pop. Collect.</title>

    <!-- Structured data for SEO + rich-result eligibility on Google.
         Schema.org/MobileApplication is the canonical fit for an
         App Store-distributed iOS game. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "Squishy Smash",
        "alternateName": "Squishy Smash: Tap. Squish. Pop. Collect.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "iOS",
        "url": "https://www.squishysmash.com/",
        "description": "The cozy kawaii collectible tap game. 48 cards across three pastel packs. Three ways to unlock every card: play, save coins, or earn through achievements.",
        "image": "https://www.squishysmash.com/social-card.jpg",
        "publisher": {
          "@type": "Organization",
          "name": "Athlete Domains"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
