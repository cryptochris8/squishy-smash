[build]
  base = "website"
  command = "npm run build"
  publish = "dist"

# Pretty-URL aliases: /privacy and /support resolve to the static
# .html files (without the SPA catch-all swallowing them). These
# specific rules MUST come before the SPA fallback below — Netlify
# evaluates redirects top-to-bottom and stops at the first match.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

# Vanity redirects — short, memorable links for the picture books' printed
# QR/Magic-Word pages, video end-cards, and social bios. They MUST come before
# the SPA fallback (Netlify stops at the first match). 302 (temporary) keeps
# each destination changeable later without browsers caching it forever.
[[redirects]]
  from = "/play"
  to = "https://www.roblox.com/games/105594294243426/Squishy-Smash-The-Lost-Sparkle"
  status = 302
  force = true

[[redirects]]
  from = "/app"
  to = "https://apps.apple.com/us/app/squishy-smash/id6762549537"
  status = 302
  force = true

[[redirects]]
  from = "/book"
  to = "https://www.amazon.com/dp/B0H3QP7ZPH"
  status = 302
  force = true

[[redirects]]
  from = "/book1"
  to = "https://www.amazon.com/dp/B0H219KX2X"
  status = 302
  force = true

[[redirects]]
  from = "/listen"
  to = "https://www.youtube.com/watch?v=_0_s3P6uN-o"
  status = 302
  force = true

# The canonical codes page (doc 15 §7.2: codes are a press channel — this is
# the URL editors cite and aggregators scrape; codes never expire, so the
# page only ever grows).
[[redirects]]
  from = "/codes"
  to = "/codes.html"
  status = 200

# SPA fallback — every other path renders the React app's index.html
# so client-side anchors (#collection, #join, etc.) work even on a
# direct deep-link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers — addresses the post-review finding that the
# Netlify deploy was shipping no headers at all. CSP is intentionally
# permissive on inline styles because the SPA's Tailwind output ships
# them; tighten by adding a hash/nonce step if/when we lock down.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Long-lived caching for fingerprinted asset bundles. Vite emits
# files with content hashes in their names, so cache-busting is
# automatic on every deploy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cards + sprites + thumbnails are content-addressed by name, not by
# hash. Cache them for a day with revalidation so a re-rendered card
# can ship without a hard reset.
[[headers]]
  for = "/cards/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/thumbnails/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
